/* ===================== CAMADA BLOCKCHAIN v2 (MetaMask + BatteryPassportRegistry) ===================== */
const CHAIN_ID_HEX='0xaa36a7',CHAIN_ID=11155111n;
const ZERO32='0x'+'0'.repeat(64);
/* Tupla do plano: a ordem reproduz EvidenceRequestInput no Solidity. Um campo
   fora de lugar muda o hash e o contrato recusa o plano inteiro. */
const PLAN_TUPLE='tuple(bytes32 evidenceRequestId,bytes32 supplierId,bytes32 materialId,bytes32 supplierLotId,bytes32 declarationHash,bytes32 casCommitment)[]';
const REGISTRY_ABI=[
 'function owner() view returns (address)',
 'function authorizedManufacturers(address) view returns (bool)',
 'function activeSuppliers(bytes32) view returns (bool)',
 'function setManufacturerAuthorization(address,bool)',
 'function setSupplier(bytes32,bool)',
 'function registerBattery(bytes32,bytes32,bytes32,bytes32,bytes32,uint32)',
 'function submitEvidencePlan(bytes32,'+PLAN_TUPLE+')',
 'function isCoverageComplete(bytes32) view returns (bool)',
 'function getBattery(bytes32) view returns (tuple(address manufacturer,bytes32 modelId,bytes32 productionLotId,bytes32 passportDataHash,bytes32 evidencePlanHash,uint32 expectedEvidenceCount,bool planSubmitted,uint8 status,uint64 registeredAt,uint64 updatedAt,uint32 evidenceCount,uint32 processedCount,uint32 verifiedCount,uint32 divergentCount,uint32 insufficientCount))',
 'function getEvidence(bytes32) view returns (tuple(bytes32 batteryId,bytes32 supplierId,bytes32 materialId,bytes32 supplierLotId,bytes32 declarationHash,bytes32 casCommitment,bytes32 evidenceHash,bytes32 ruleSetHash,bytes32 explanationHash,bytes32 creReportHash,bytes32 workflowId,bytes2 creReportId,uint8 status,uint64 requestedAt,uint64 processedAt))'
];
const EVIDENCE_STATE=['NONE','PENDING','DOCUMENTS_VERIFIED','DIVERGENT','INSUFFICIENT_EVIDENCE'];
const BATTERY_STATE=['NONE','REGISTERED','VERIFYING','DOCUMENTS_VERIFIED','DIVERGENT','INSUFFICIENT_EVIDENCE'];
const contractAddress=()=>String(S.chain?.contract||CONTRACT).trim();

async function connectWallet(){
  if(!window.ethereum)throw new Error('MetaMask não encontrada neste navegador.');
  const provider=new ethers.BrowserProvider(window.ethereum);
  await provider.send('eth_requestAccounts',[]);
  const net=await provider.getNetwork();
  if(net.chainId!==CHAIN_ID){
    try{await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN_ID_HEX}]})}
    catch(_){throw new Error('Troque a MetaMask para a rede Sepolia e tente de novo.')}
  }
  const p2=new ethers.BrowserProvider(window.ethereum),signer=await p2.getSigner(),account=await signer.getAddress();
  S.chain.account=account;save();
  return {provider:p2,signer,account};
}
const registryWith=runner=>new ethers.Contract(contractAddress(),REGISTRY_ABI,runner);
async function existsOnchain(c,fn,arg){try{await c[fn](arg);return true}catch(_){return false}}

/* O Supabase entrega o plano pronto: identificadores, hashes de identidade e o
   compromisso do CAS. O navegador não calcula nada disso — o salt nunca sai do
   banco. Aqui só ordenamos e montamos a tupla. */
async function fetchEvidencePlan(batteryHash){
  if(!S.conn.url||!S.conn.key)throw new Error('Conecte a Edge Function em Configurações antes.');
  const r=await fetch(S.conn.url.replace(/\/$/,'')+'/functions/v1/super-worker',{method:'POST',headers:{apikey:S.conn.key,Authorization:'Bearer '+S.conn.key,'Content-Type':'application/json'},body:JSON.stringify({action:'list_evidence',battery_id:batteryHash})});
  const txt=await r.text();let j=null;try{j=JSON.parse(txt)}catch(_){}
  if(!r.ok||!j?.ok)throw new Error(j?.error||('HTTP '+r.status+' ao ler o plano de evidências'));
  const items=(j.items||[]).slice().sort((a,b)=>BigInt(a.evidence_request_id)<BigInt(b.evidence_request_id)?-1:1);
  return items;
}
/* A ordem crescente é exigida pelo contrato: ela torna o hash canônico, e a
   mesma comparação rejeita duplicatas. */
const planTuples=items=>items.map(x=>[x.evidence_request_id,x.supplier_id_hash,x.material_id_hash,x.supplier_lot_id_hash,x.declaration_hash,x.cas_commitment||ZERO32]);
function evidencePlanHash(batteryHash,items){
  const coder=ethers.AbiCoder.defaultAbiCoder();
  return ethers.keccak256(coder.encode(['bytes32',PLAN_TUPLE],[batteryHash,planTuples(items)]));
}

/* Estado on-chain por evidencia, lido sob demanda. Fica em memoria de
   sessao: a fonte e o contrato, nao o navegador. */
let ONCHAIN={};
/* Resultado da verificacao, lido do Supabase sob demanda. O ECHA nao existe
   na blockchain: o contrato guarda o hash do resultado, nao o status
   regulatorio. Entao esta leitura e do banco, nao do contrato. */
let RESULTADOS={};
let CHAINLOG=[];
function chainSay(msg,kind='g'){CHAINLOG.unshift({msg,kind});CHAINLOG=CHAINLOG.slice(0,60);log(kind,'On-chain · '+msg);const el=document.getElementById('chain-log');if(el)el.innerHTML=chainLogView()}
const chainLogView=()=>CHAINLOG.length?CHAINLOG.map(x=>`<div><span class="${x.kind}">▸</span> ${esc(x.msg)}</div>`).join(''):'<div>Sem atividade on-chain nesta sessão.</div>';
const chainErr=e=>e?.shortMessage||e?.reason||e?.message||String(e);

window.__connectWallet=async()=>{
  try{const {account}=await connectWallet();toast('Carteira conectada: '+account.slice(0,10)+'…');render()}
  catch(e){toast(chainErr(e))}
};
window.__saveChain=()=>{const v=document.getElementById('c-contract').value.trim();if(!/^0x[0-9a-fA-F]{40}$/.test(v))return toast('Endereço de contrato inválido.');S.chain.contract=v;save();toast('Contrato atualizado.');render()};

/* Passo 1: registrar a bateria já com o compromisso do plano.
   O contrato exige evidencePlanHash e expectedEvidenceCount no cadastro, de
   modo que o denominador da cobertura fica fixado antes de qualquer coleta.
   Por isso o registro on-chain acontece depois da importação, não antes. */
window.__registerOnchain=async id=>{
  const b=S.batteries.find(x=>x.id===id);if(!b)return;
  const btn=document.getElementById('chain-register');
  if(btn){btn.disabled=true;btn.textContent='Registrando…'}
  try{
    const {signer,account}=await connectWallet();
    const c=registryWith(signer);
    chainSay('Carteira '+account+' · contrato '+contractAddress());

    const items=await fetchEvidencePlan(b.battery_id);
    if(!items.length)throw new Error('Nenhuma evidência no Supabase para esta bateria. Importe a declaração antes.');
    const planHash=evidencePlanHash(b.battery_id,items);
    chainSay(items.length+' evidência(s) no plano · planHash '+short(planHash));

    if(await existsOnchain(c,'getBattery',b.battery_id)){
      const bt=await c.getBattery(b.battery_id);
      if(bt.evidencePlanHash.toLowerCase()!==planHash.toLowerCase()){
        throw new Error('A bateria já está registrada com outro plano. O plano on-chain é imutável.');
      }
      chainSay('Bateria já registrada com este mesmo plano');
      b.plan_hash_onchain=planHash;save();render();
      return toast('Bateria já registrada. Siga para o envio do plano.');
    }

    if(!await c.authorizedManufacturers(account)){
      const owner=await c.owner();
      if(owner.toLowerCase()!==account.toLowerCase())throw new Error('Carteira não é fabricante autorizado nem owner do contrato.');
      chainSay('Autorizando fabricante…','a');
      await (await c.setManufacturerAuthorization(account,true)).wait();
      chainSay('Fabricante autorizado');
    }

    chainSay('Registrando bateria com o plano…','a');
    const tx=await c.registerBattery(b.battery_id,b.model_id,b.production_lot_id,b.passport_data_hash,planHash,items.length);
    await tx.wait();
    b.registration_tx=tx.hash;b.plan_hash_onchain=planHash;save();
    chainSay('Bateria registrada · '+tx.hash);
    toast('Bateria registrada on-chain.');render();
  }catch(e){chainSay(chainErr(e),'r');toast(chainErr(e))}
  finally{const x=document.getElementById('chain-register');if(x){x.disabled=false;x.textContent='1 · Registrar bateria e plano'}}
};

/* Passo 2: enviar o plano inteiro numa transação.
   O contrato reconstrói o hash a partir do que chega e recusa se divergir, então
   trocar qualquer campo depois do registro é impossível. */
window.__submitPlanOnchain=async id=>{
  const b=S.batteries.find(x=>x.id===id);if(!b)return;
  const btn=document.getElementById('chain-plan');
  if(btn){btn.disabled=true;btn.textContent='Enviando…'}
  try{
    const {signer,account}=await connectWallet();
    const c=registryWith(signer);

    if(!await existsOnchain(c,'getBattery',b.battery_id))throw new Error('Registre a bateria on-chain antes de enviar o plano.');
    const bt=await c.getBattery(b.battery_id);
    if(bt.planSubmitted){chainSay('Plano já enviado on-chain');return toast('O plano desta bateria já foi enviado.')}

    const items=await fetchEvidencePlan(b.battery_id);
    const planHash=evidencePlanHash(b.battery_id,items);
    if(planHash.toLowerCase()!==bt.evidencePlanHash.toLowerCase()){
      throw new Error('O plano no Supabase mudou depois do registro. Os compromissos não conferem.');
    }
    chainSay('Plano confere com o compromisso do registro');

    for(const sid of [...new Set(items.map(x=>x.supplier_id_hash))]){
      if(await c.activeSuppliers(sid))continue;
      const owner=await c.owner();
      if(owner.toLowerCase()!==account.toLowerCase()){chainSay('Fornecedor inativo e você não é owner: '+short(sid),'r');continue}
      chainSay('Ativando fornecedor '+short(sid)+'…','a');
      await (await c.setSupplier(sid,true)).wait();
      chainSay('Fornecedor ativo');
    }

    chainSay('Enviando '+items.length+' evidência(s) numa transação…','a');
    const tx=await c.submitEvidencePlan(b.battery_id,planTuples(items));
    await tx.wait();
    b.plan_tx=tx.hash;save();
    chainSay('Plano registrado · '+tx.hash);
    toast(items.length+' evidência(s) registradas em uma transação.');render();
  }catch(e){chainSay(chainErr(e),'r');toast(chainErr(e))}
  finally{const x=document.getElementById('chain-plan');if(x){x.disabled=false;x.textContent='2 · Enviar plano de evidências'}}
};

function audit(){return head('Auditoria','Provas criptográficas, ambiente de rede e limitações da implementação.')+`<div class="grid g2"><section class="panel"><header><h2>Ambiente blockchain</h2></header><div class="pad"><dl class="kv"><dt>Rede</dt><dd>Ethereum Sepolia</dd><dt>chainId</dt><dd>11155111</dd><dt>Contrato</dt><dd>${esc(contractAddress())}</dd><dt>Forwarder CRE</dt><dd>${FORWARDER}</dd><dt>Carteira</dt><dd>${esc(S.chain?.account||'não conectada')}</dd></dl></div></section><section class="panel"><header><h2>Limites explícitos</h2></header><div class="pad"><div class="note warn">O navegador assina o registro da bateria e das solicitações de evidência. A verificação e a escrita do relatório continuam a cargo do workflow CRE; este arquivo não usa credenciais S2S.</div><button class="btn quiet" onclick="__go('contrato')">Ver pendências técnicas do contrato</button></div></section></div><section class="panel"><header><h2>Artefatos imutáveis no protótipo</h2></header><div class="pad"><dl class="kv"><dt>Versões de produto</dt><dd>${S.products.length}</dd><dt>Manifestos históricos</dt><dd>${S.manifests.length}</dd><dt>Snapshots ativos</dt><dd>${S.snapshot.loaded?1:0}</dd></dl></div></section>`}
function contractView(){return head('Pendências técnicas do contrato','Visão para desenvolvimento; removida da navegação principal para não competir com a operação.')+`<div class="note bad"><strong>Bloqueio conhecido:</strong> a implementação de referência exige explanationHash no relatório individual, embora a explicação só exista após a cobertura completa. O contrato precisa aceitar hash zero nessa fase ou separar o relatório agregado.</div>${[['Vínculo da declaração','Comparar declarationHash do relatório com o compromisso original.'],['Plano on-chain','Registrar evidencePlanHash e expectedEvidenceCount antes de concluir DOCUMENTS_VERIFIED.'],['Revisões','Permitir nova revisão após atualização de datasetHash, preservando o histórico.'],['Estados','Representar ERROR, CANCELLED e finalidade da transação.']].map(([t,d])=>`<section class="panel"><header><h2>${t}</h2><span class="spacer"></span><span class="tag bad">PENDENTE</span></header><div class="pad">${d}</div></section>`).join('')}`}
function settings(){return head('Configurações','Conexão do navegador com a API protegida e com o contrato na Sepolia.')+`<div class="note"><strong>Arquitetura ativa.</strong> O navegador usa somente a chave publishable e chama a Edge Function <span class="mono">super-worker</span>. A função consulta o banco com a credencial secreta mantida pelo Supabase. Nunca coloque uma chave <span class="mono">sb_secret_</span> nesta tela.</div><section class="panel"><header><h2>Supabase · Edge Function</h2></header><div class="pad"><div class="field"><label>URL base do projeto</label><input id="c-url" class="mono" value="${esc(S.conn.url)}" placeholder="https://mnmflnqmohgsxgavwenn.supabase.co"><p class="hint">Informe apenas a URL base. Caminhos como /rest/v1 e /functions/v1 são removidos automaticamente.</p></div><div class="field"><label>Chave publishable</label><input id="c-key" type="password" class="mono" value="${esc(S.conn.key)}"><p class="hint">A chave pública começa com sb_publishable_. A chave secreta nunca sai do backend.</p></div><button class="btn" onclick="__testConnection()">Testar Edge Function</button><div id="c-result" style="margin-top:14px"></div></div></section><section class="panel"><header><h2>Blockchain · Sepolia</h2></header><div class="pad"><div class="field"><label>Endereço do contrato</label><input id="c-contract" class="mono" value="${esc(contractAddress())}" placeholder="0x…"><p class="hint">BatteryPassportRegistry na rede de teste Sepolia. Alterar aqui muda o destino de todas as transações.</p></div><div class="row"><button class="btn" onclick="__saveChain()">Salvar contrato</button><button class="btn ghost" onclick="__connectWallet()">Conectar MetaMask</button></div><dl class="kv" style="margin-top:14px"><dt>Carteira conectada</dt><dd>${esc(S.chain?.account||'nenhuma')}</dd><dt>Forwarder CRE</dt><dd>${FORWARDER}</dd></dl><p class="hint">A carteira precisa ser fabricante autorizado no contrato. Se ela for a owner, a autorização é feita automaticamente no primeiro envio.</p></div></section><section class="panel"><header><h2>Migrações esperadas</h2></header><div class="pad"><div class="log"><div>1 · supabase_battery_core.sql</div><div>2 · supabase_echa_candidate_list.sql</div><div>3 · supabase_scip_determination.sql</div><div>4 · supabase_battery_ai_explanations.sql</div><div>5 · supabase_pubchem_identity.sql</div></div></div></section>`}
window.__testConnection=async()=>{const raw=document.getElementById('c-url').value.trim(),url=raw.replace(/\/(?:rest|functions)\/v1(?:\/.*)?$/,'').replace(/\/$/,''),key=document.getElementById('c-key').value.trim(),out=document.getElementById('c-result');if(!url||!key)return toast('Informe a URL base e a chave publishable.');if(!/^https:\/\/[^/]+\.supabase\.co$/.test(url))return toast('A URL deve ser a URL base do projeto Supabase.');if(!key.startsWith('sb_publishable_'))return toast('Use somente a chave que começa com sb_publishable_.');document.getElementById('c-url').value=url;S.conn={url,key,ok:false};out.innerHTML='<div class="note">Chamando a Edge Function super-worker…</div>';try{const r=await fetch(url+'/functions/v1/super-worker',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({action:'health'})}),txt=await r.text();let payload=null;try{payload=JSON.parse(txt)}catch(_){}const connected=r.ok&&payload?.ok===true;S.conn.ok=connected;out.innerHTML=`<div class="note ${connected?'':'warn'}"><strong>HTTP ${r.status}.</strong> ${connected?'Edge Function conectada ao banco com segurança.':'A Edge Function respondeu, mas não confirmou a conexão com o banco.'}</div><div class="log">${esc(txt.slice(0,700))}</div>`;document.getElementById('mode').textContent=connected?'edge function conectada':'protótipo local · função com erro';document.getElementById('mode').classList.toggle('live',connected);save()}catch(e){S.conn.ok=false;out.innerHTML=`<div class="note bad"><strong>Falha de rede ou CORS.</strong> ${esc(e.message)}</div>`;document.getElementById('mode').textContent='protótipo local · função inacessível';document.getElementById('mode').classList.remove('live');save()}};
window.__loadSnapshot=async()=>{if(!S.conn.url||!S.conn.key)return;const h={apikey:S.conn.key,Authorization:'Bearer '+S.conn.key};try{const r=await fetch(S.conn.url+'/rest/v1/echa_candidate_list_snapshots?status=eq.ACTIVE&select=id,package_version,dataset_hash,published_at&limit=1',{headers:h});if(!r.ok)throw new Error('HTTP '+r.status+' ao ler snapshot');const [sn]=await r.json();if(!sn)throw new Error('Nenhum snapshot ACTIVE');const e=await fetch(S.conn.url+'/rest/v1/echa_candidate_list_entries?snapshot_id=eq.'+sn.id+'&select=echa_id,substance_name,ec_number,cas_number,inclusion_date,reason_for_inclusion&limit=5000',{headers:h});if(!e.ok)throw new Error('HTTP '+e.status+' ao ler entradas');const rows=await e.json();activateSnapshot(rows.map(x=>({echa_id:x.echa_id||'',name:x.substance_name||'',ec:x.ec_number||'',cas:x.cas_number||'',inclusion:x.inclusion_date||'',reason:x.reason_for_inclusion||''})),sn.package_version,'SUPABASE_ACTIVE',{id:sn.id,hash:sn.dataset_hash,published:sn.published_at})}catch(e){toast(e.message);log('r','Snapshot não carregado · '+e.message)}};
function report(id){const b=S.batteries.find(x=>x.id===Number(id));if(!b)return'<div class="empty">Bateria não encontrada.</div>';const p=productOf(b),c=coverage(b),m=manifestOf(b),rh=hashOf({battery:b.battery_id,plan:b.plan_hash,dataset:S.snapshot.hash,rule:RULE_SET_HASH,slots:activeSlots(b).map(s=>({slot:s.evidence_slot_id,decl:s.declaration_hash,echa:s.echa.hash,scip:s.scip.hash})),manifest:m?.manifest_hash,dossier:b.validated_dossier?.hash,response:b.submission?.response_hash});return`<div class="printbar"><button class="btn" onclick="print()">Imprimir / salvar PDF</button><button class="btn quiet" onclick="__go('bateria/${b.id}')">Voltar</button><span class="hint">Relatório de verificação da unidade; o dossiê SCIP, quando aplicável, pertence à versão do produto.</span></div><article class="sheet"><div class="eyebrow">Rastro Batt · relatório de verificação</div><h1>${esc(b.serial)}</h1><p>${esc(p?.article||b.model)} · versão de produto #${b.article_definition_version_id}</p><section><h3>1 · Identidade da unidade</h3><dl class="kv">${hashRow('batteryId',b.battery_id)}${hashRow('passportDataHash',b.passport_data_hash)}<dt>Estado determinístico</dt><dd>${b.state}</dd><dt>Cobertura</dt><dd>${c.processed}/${b.expected||'—'}</dd></dl></section><section><h3>2 · Evidências</h3><table><thead><tr><th>evidence_slot_id</th><th>Artigo</th><th>Substância</th><th>ECHA</th><th>SCIP</th></tr></thead><tbody>${activeSlots(b).map(s=>`<tr><td class="hash">${short(s.evidence_slot_id)} · tentativa ${s.attempt}</td><td>${esc(s.article_name||s.article_id)}</td><td>${esc(s.cas||s.ec||s.echa_id)}</td><td>${esc(s.echa.regulatory_status||'PENDING')}</td><td>${esc(s.scip.determination||'PENDING')}</td></tr>`).join('')}</tbody></table></section><section><h3>3 · Escopo SCIP</h3><p>${m?`Manifesto ${short(m.manifest_hash)} escopado por article_definition_version_id ${m.article_definition_version_id}.`:'Nenhum manifesto SCIP atual.'}</p><p>A geração e a validação do pacote IUCLID, bem como a submissão ao SCIP, dependem de conta ECHA e permanecem fora desta implementação.</p></section><section><h3>4 · Índice de provas</h3><dl class="kv">${hashRow('evidencePlanHash',b.plan_hash)}${hashRow('datasetHash',S.snapshot.hash)}${hashRow('ruleSetHash',RULE_SET_HASH)}${hashRow('manifestHash',m?.manifest_hash)}${hashRow('registrationTxHash',b.registration_tx)}${hashRow('reportHash',rh)}</dl></section><section><h3>5 · Limites</h3><p>Documento de verificação documental. Não certifica composição, segurança ou conformidade integral. NOT_FOUND_IN_SNAPSHOT significa apenas ausência de correspondência na versão consultada.</p></section></article>`}
let SNAPSHOT_LIDO=false;
/* A referencia regulatoria vem do banco; o painel so a exibe. Uma leitura
   por sessao basta, e ela nao bloqueia o resto da tela. */
function autoSnapshot(){if(SNAPSHOT_LIDO||S.snapshot.loaded||!S.conn.url||!S.conn.key)return;SNAPSHOT_LIDO=true;__loadSnapshot().catch(()=>{})}
function render(){autoSnapshot();const mode=document.getElementById('mode');mode.textContent=S.conn.ok?'edge function conectada':'protótipo local · sem backend';mode.classList.toggle('live',!!S.conn.ok);document.getElementById('nav').innerHTML=nav();const [r,id]=route(),views={painel:dashboard,produtos:products,baterias:batteries,fornecedores:suppliers,nova:formNew,auditoria:audit,configuracoes:settings,contrato:contractView};document.getElementById('view').innerHTML=r==='bateria'?batteryDetail(id):r==='relatorio'?report(id):(views[r]||dashboard)();if(r==='nova')window.__previewNew()}render();
</script>
</body>
</html>

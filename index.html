function suppliers(){const imports=S.supplierImports||[];return head('Fornecedores','Recebimento controlado de declarações químicas. XML, JSON e anexos são persistidos no Supabase antes de entrarem na fila do CRE.')+`<div class="steps" style="margin-bottom:18px"><div class="step"><b>01 · RECEBER</b>XML, JSON e anexos</div><div class="step"><b>02 · VALIDAR</b>Perfil, identidade e hash</div><div class="step"><b>03 · NORMALIZAR</b>Slots de evidência</div><div class="step"><b>04 · VERIFICAR</b>CRE ECHA e SCIP</div></div><section class="panel"><header><h2>Nova declaração de fornecedor</h2><span class="spacer"></span><button class="btn quiet sm" onclick="__downloadSupplierSchema()">Baixar JSON Schema v1</button></header><div class="pad">${S.batteries.length?`<div class="grid g2"><div class="field"><label>Bateria / versão destinatária</label><select id="sup-battery">${S.batteries.map(b=>`<option value="${b.id}">${esc(b.serial)} · versão #${b.article_definition_version_id}</option>`).join('')}</select></div><div class="field"><label>Formato declarado</label><select id="sup-format" onchange="__supplierFormat()"><option value="RASTRO_XML_V1">XML Rastro Batt v1</option><option value="RASTRO_JSON_V1">JSON Rastro Batt v1</option></select></div></div><div class="uploadbox"><div class="field"><label>Declaração estruturada</label><input id="sup-file" type="file" accept=".xml,application/xml,text/xml" onchange="__supplierFiles()"><p class="hint" id="sup-file-help">Perfil XML Rastro Batt v1 para normalização regulatória. Não é apresentado como IPC-1752B oficial.</p></div><div class="field"><label>SDS e certificados — opcionais</label><input id="sup-attachments" type="file" accept=".pdf,application/pdf" multiple onchange="__supplierFiles()"><p class="hint">Somente PDF. Cada anexo recebe hash próprio e permanece separado da declaração.</p></div><div class="filelist" id="sup-file-list">Nenhum arquivo selecionado.</div></div><div class="row" style="margin-top:15px"><button class="btn" onclick="__validateSupplierImport()">Enviar e criar evidências pendentes</button><span class="hint">O backend recalcula o hash, confere a bateria e grava os dados antes de aceitar.</span></div><div id="sup-result" style="margin-top:14px"></div>`:`<div class="empty"><strong>Cadastre uma bateria primeiro</strong>A declaração precisa de um destino e de uma versão de produto imutável.</div>`}</div></section><section class="panel"><header><h2>Declarações recebidas</h2><span class="spacer"></span><span class="eyebrow">${imports.length} importação(ões)</span></header>${imports.length?`<table><thead><tr><th>Recebida</th><th>Bateria</th><th>Fornecedor / referência</th><th>Formato</th><th>Arquivo</th><th>Anexos</th><th>Estado</th></tr></thead><tbody>${[...imports].reverse().map(i=>{const b=S.batteries.find(x=>x.id===i.battery_id);return`<tr><td>${new Date(i.received_at).toLocaleString('pt-BR')}</td><td>${esc(b?.serial||'—')}</td><td>${esc(i.supplier_name||'aguardando extração')}<br><span class="hash">${esc(i.reference||'—')}</span></td><td class="mono">${esc(i.format)}</td><td>${esc(i.file_name)}<br><span class="hash">${short(i.file_hash)}</span></td><td>${(i.attachments||[]).length}</td><td>${importTag(i.status)}${i.errors?.length?`<br><span class="hash">${esc(i.errors.join(' · '))}</span>`:''}</td></tr>`}).join('')}</tbody></table>`:`<div class="empty"><strong>Nenhuma declaração recebida</strong>O arquivo original, seu hash e o resultado da validação aparecerão aqui.</div>`}</section><div class="note"><strong>Controle de duplicidade:</strong> o mesmo arquivo para a mesma bateria aparece uma única vez. Uma nova declaração, com outro hash, continua permitida.<br><strong>Estado correto:</strong> <span class="mono">PENDING_VERIFICATION</span> significa que o backend aceitou, armazenou e normalizou a declaração; o CRE ainda precisa verificar as substâncias contra as fontes regulatórias.</div>`}

window.__supplierFiles=()=>{const f=document.getElementById('sup-file')?.files?.[0],a=[...(document.getElementById('sup-attachments')?.files||[])],out=document.getElementById('sup-file-list');if(out)out.textContent=[f?`Declaração: ${f.name} · ${f.size} bytes`:'Declaração ausente',a.length?`Anexos: ${a.map(x=>x.name).join(', ')}`:'Sem anexos'].join(' | ')};
async function fileHash(file){const data=await file.arrayBuffer(),digest=await crypto.subtle.digest('SHA-256',data);return'0x'+[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function validateSupplierJson(j){const errors=[];if(j?.schema_version!=='RASTRO_BATT_SUPPLIER_DECLARATION_V1')errors.push('schema_version inválido');if(!j?.supplier?.id||!j?.supplier?.name)errors.push('supplier.id e supplier.name são obrigatórios');if(!j?.declaration?.reference||!/^\d{4}-\d{2}-\d{2}$/.test(j?.declaration?.issued_at||''))errors.push('declaration.reference e issued_at ISO são obrigatórios');if(!j?.product?.part_number||!j?.product?.supplier_lot)errors.push('product.part_number e supplier_lot são obrigatórios');if(!Array.isArray(j?.substances)||!j.substances.length)errors.push('substances precisa conter ao menos um item');(j?.substances||[]).forEach((s,n)=>{const p=`substances[${n}]`;if(!s.material||!s.article_id||!s.article_name||!s.substance_name)errors.push(p+': material, artigo e substância são obrigatórios');if(!s.cas&&!s.ec_number&&!s.echa_id)errors.push(p+': informe CAS, EC Number ou ECHA ID');if(typeof s.concentration_w_w!=='number'||s.concentration_w_w<0||s.concentration_w_w>100)errors.push(p+': concentration_w_w deve estar entre 0 e 100');if(!s.location||!s.operator_role||typeof s.placed_on_eu_market!=='boolean')errors.push(p+': localização, operador e mercado UE são obrigatórios')});return errors}
function backendBatteryMetadata(b){const p=productOf(b);if(!p?.article||!p?.brand||!p?.part)return null;return{battery_id:b.battery_id,serial_number:b.serial,model_id:b.model_id,production_lot_id:b.production_lot_id,passport_data_hash:b.passport_data_hash,article_definition_id:p.article_definition_id,version_label:p.version,article_name:p.article,brand:p.brand,part_number:p.part,data_source:p.source||'USER_DECLARED_IN_FRONTEND',definition_hash:p.definition_hash,composition_hash:p.definition_hash,bom_hash:hashOf({article_definition_id:p.article_definition_id,model_id:b.model_id,version:p.version}),supplier_set_hash:hashOf({article_definition_id:p.article_definition_id,suppliers:[]}),rule_set_hash:RULE_SET_HASH}}
function addRemoteSubstances(b,remote,attachmentHashes){for(const s of remote.substances||[]){const exists=activeSlots(b).some(x=>x.article_id===s.article_id&&x.material===s.material&&x.cas===(s.cas_number||'')&&x.ec===(s.ec_number||'')&&x.supplier_lot_id===KECCAK(remote.supplier.lot));if(exists)continue;addSlot(b,{request:remote.declaration_reference,supplier:remote.supplier.name,lot:remote.supplier.lot,material:s.material,declared_name:s.substance_name,cas:s.cas_number||'',ec:s.ec_number||'',echa_id:s.echa_id||'',conc:String(s.concentration_max_w_w),article_name:s.article_name,article_id:s.article_id,parent:'',location:s.substance_location,role:s.operator_role||remote.supplier.operator_role,market:s.placed_on_eu_market??remote.supplier.placed_on_eu_market,sds:attachmentHashes.join(','),scip:''})}}
window.__validateSupplierImport=async()=>{const b=S.batteries.find(x=>x.id===Number(document.getElementById('sup-battery').value)),format=document.getElementById('sup-format').value,file=document.getElementById('sup-file').files[0],files=[...document.getElementById('sup-attachments').files],out=document.getElementById('sup-result');if(!b)return toast('Selecione uma bateria válida.');if(b.plan_closed)return toast('Reabra o plano de evidências antes de importar uma nova declaração.');if(!file)return toast('Selecione a declaração do fornecedor.');if(!S.conn.url||!S.conn.key)return toast('Conecte a Edge Function em Configurações antes do upload.');if(files.some(x=>x.type!=='application/pdf'&&!x.name.toLowerCase().endsWith('.pdf')))return toast('Os anexos precisam ser PDF.');const metadata=backendBatteryMetadata(b);if(!metadata)return toast('A bateria precisa de nome do artigo, marca e part number antes da importação.');out.innerHTML='<div class="note">Enviando arquivos, recalculando hashes e normalizando no backend…</div>';const localHash=await fileHash(file),attachmentMeta=await Promise.all(files.map(async x=>({name:x.name,size:x.size,hash:await fileHash(x)}))),previous=S.supplierImports.find(x=>x.battery_id===b.id&&x.file_hash===localHash),entry=previous||{id:S.seq++,battery_id:b.id,received_at:now()};Object.assign(entry,{format,file_name:file.name,file_size:file.size,file_hash:localHash,attachments:attachmentMeta,status:'UPLOADING',supplier_name:null,reference:null,errors:[]});if(!previous)S.supplierImports.push(entry);save();try{const form=new FormData();form.append('format',format);form.append('metadata',JSON.stringify(metadata));form.append('declaration',file,file.name);files.forEach(x=>form.append('attachments',x,x.name));const r=await fetch(S.conn.url.replace(/\/$/,'')+'/functions/v1/super-worker',{method:'POST',headers:{apikey:S.conn.key,Authorization:'Bearer '+S.conn.key},body:form}),txt=await r.text();let remote=null;try{remote=JSON.parse(txt)}catch(_){}if(!r.ok||!remote?.ok)throw new Error(remote?.error||('HTTP '+r.status));Object.assign(entry,{remote_id:remote.import_id||remote.id,status:remote.status||'PENDING_VERIFICATION',supplier_name:remote.supplier?.name||null,reference:remote.declaration_reference||null,file_hash:remote.original_sha256||localHash,errors:[]});addRemoteSubstances(b,remote,attachmentMeta.map(x=>x.hash));log('g',(remote.duplicate?'Declaração já existente reconciliada':'Declaração persistida no Supabase')+' · '+(entry.supplier_name||entry.reference)+' · '+(remote.substance_count||remote.substances?.length||0)+' evidência(s) PENDING');save();toast(remote.duplicate?'Importação já existia; estado local reconciliado.':'Importação aceita e enviada à fila do CRE.');render()}catch(e){entry.status=String(e.message).includes('REJECTED_SCHEMA')?'REJECTED_SCHEMA':'ERROR';entry.errors=[e.message];log('r','Falha na importação do fornecedor · '+e.message);save();render();toast('Importação não aceita: '+e.message)}};
window.__downloadSupplierSchema=()=>{const blob=new Blob([JSON.stringify(SUPPLIER_JSON_SCHEMA,null,2)],{type:'application/schema+json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rastro-batt-supplier-declaration-v1.schema.json';a.click();URL.revokeObjectURL(a.href)};

let TAB='geral';window.__tab=t=>{TAB=t;render()};function batteryDetail(id){const b=S.batteries.find(x=>x.id===Number(id));if(!b)return`<div class="empty"><strong>Bateria não encontrada</strong></div>`;const p=productOf(b),c=coverage(b),tabs=[['geral','Visão geral'],['evidencias','Declarações e evidências'],['echa','Identidade & ECHA'],['scip','SCIP'],['dossie','Dossiê & S2S'],['explicacao','Explicação'],['auditoria','Auditoria']];return head(esc(b.serial),`${esc(p?.article||b.model)} · ${esc(b.model)} · lote ${esc(b.lot)} · versão de produto #${b.article_definition_version_id} &nbsp; ${stateTag(b)}`,`<button class="btn" onclick="__cycle(${b.id})">Simular ciclo regulatório</button><button class="btn ghost" onclick="__go('relatorio/${b.id}')">Relatório</button><button class="btn quiet" onclick="__go('baterias')">Voltar</button>`)+`<section class="panel"><div class="pad">${rail(b)}<p class="hint">A simulação executa a mesma ordem determinística no navegador, mas não é uma execução Chainlink CRE nem uma submissão ECHA.</p></div></section><div class="tabs">${tabs.map(([k,l])=>`<button class="${TAB===k?'on':''}" onclick="__tab('${k}')">${l}</button>`).join('')}</div>${({geral:tabGeneral,evidencias:tabEvidence,echa:tabEcha,scip:tabScip,dossie:tabDossier,explicacao:tabExplanation,auditoria:tabAudit}[TAB]||tabGeneral)(b,c,p)}`}

<input id="s-lot"></div><div class="field"><label>Material</label><input id="s-material"></div><div class="field"><label>Nome declarado da substância</label><input id="s-name"></div><div class="field"><label>CAS</label><input id="s-cas" class="mono"></div><div class="field"><label>EC number</label><input id="s-ec" class="mono"></div><div class="field"><label>ECHA ID</label><input id="s-echa" class="mono"></div><div class="field"><label>Concentração no artigo (% m/m)</label><input id="s-conc" type="number" step="0.001"></div><div class="field"><label>Nome do artigo/componente</label><input id="s-article-name"></div><div class="field"><label>Identificador do artigo</label><input id="s-article-id" class="mono"><p class="hint">Repita este ID para adicionar outros CAS ao mesmo componente.</p></div><div class="field"><label>Artigo pai (ID)</label><input id="s-parent" class="mono"></div><div class="field"><label>Localização da substância</label><input id="s-location"></div><div class="field"><label>Papel do operador</label><select id="s-role"><option>EU_IMPORTER</option><option>EU_PRODUCER</option><option>EU_ASSEMBLER</option><option>EU_DISTRIBUTOR</option><option>EU_RETAILER</option><option>NON_EU_MANUFACTURER</option></select></div><div class="field"><label>Colocado no mercado da UE</label><select id="s-market"><option value="true">Sim</option><option value="false">Não</option><option value="">Não informado</option></select></div><div class="field"><label>SDS / certificado</label><input id="s-sds"></div><div class="field"><label>Número SCIP anterior</label><input id="s-scip" class="mono"></div></div><button class="btn" onclick="__addEvidence(${b.id})" ${b.plan_closed?'disabled':''}>Adicionar ao plano</button></div></section>`}
window.__addEvidence=id=>{const b=S.batteries.find(x=>x.id===id),v=i=>document.getElementById(i).value.trim(),mk=v('s-market');if(!v('s-request')||(!v('s-cas')&&!v('s-ec')&&!v('s-echa'))||!v('s-article-id'))return toast('Informe pedido, artigo e ao menos CAS, EC ou ECHA ID.');try{addSlot(b,{request:v('s-request'),supplier:v('s-supplier'),lot:v('s-lot'),material:v('s-material'),declared_name:v('s-name'),cas:v('s-cas'),ec:v('s-ec'),echa_id:v('s-echa'),conc:v('s-conc'),article_name:v('s-article-name'),article_id:v('s-article-id'),parent:v('s-parent'),location:v('s-location'),role:v('s-role'),market:mk===''?null:mk==='true',sds:v('s-sds'),scip:v('s-scip')});save();toast('Evidência adicionada.');render()}catch(e){toast(e.message)}};
window.__close=id=>{const b=S.batteries.find(x=>x.id===id);try{closePlan(b);save();render()}catch(e){toast(e.message)}};window.__reopen=id=>{const b=S.batteries.find(x=>x.id===id);b.plan_closed=false;invalidate(b,'plano reaberto');save();render()};window.__cancel=(bid,sid)=>{const b=S.batteries.find(x=>x.id===bid),s=b.slots.find(x=>x.id===sid);s.cancelled=true;invalidate(b,'slot cancelado');save();render()};window.__cycle=id=>cycle(S.batteries.find(x=>x.id===id));
function tabEcha(b){return`<div class="note">A correspondência usa ECHA ID, EC e CAS; resultados múltiplos são AMBIGUOUS. O PubChem é uma fonte de corroboração, não a única autoridade regulatória.</div><section class="panel"><header><h2>Identidade química e Candidate List</h2><span class="spacer"></span><span class="eyebrow">${esc(S.snapshot.version||'sem snapshot')}</span></header>${activeSlots(b).length?`<table><thead><tr><th>Substância</th><th>Identidade</th><th>Fonte</th><th>ECHA</th><th>Correspondência</th></tr></thead><tbody>${activeSlots(b).map(s=>`<tr><td>${esc(s.declared_name||s.cas||s.ec||s.echa_id||'—')}<br><span class="hash">CAS ${esc(s.cas||'—')} · EC ${esc(s.ec||'—')} · ECHA ${esc(s.echa_id||'—')}</span></td><td><span class="tag ${s.identity.status==='CORROBORATED'?'ok':s.identity.status==='ERROR'?'bad':'pending'}">${s.identity.status}</span>${s.identity.error?`<br><span class="hash">${esc(s.identity.error)}</span>`:''}</td><td class="mono">${esc(s.identity.source||'—')}</td><td>${echaTag(s)}</td><td>${s.echa.matches.map(x=>esc(x.name||x.cas||x.ec)).join('<br>')||'—'}</td></tr>`).join('')}</tbody></table>`:`<div class="empty"><strong>Sem evidências</strong></div>`}</section>`}
function tabScip(b){return`<section class="panel"><header><h2>Determinação determinística</h2><span class="spacer"></span><span class="hash">ruleSetHash ${short(RULE_SET_HASH)}</span></header>${activeSlots(b).length?`<table><thead><tr><th>Artigo · identificador</th><th>Estado</th><th>Regra aplicada</th><th>Modo</th><th>Campos ausentes</th></tr></thead><tbody>${activeSlots(b).map(s=>`<tr><td>${esc(s.article_name||'—')}<br><span class="hash">${esc(s.cas||s.ec||s.echa_id||'—')}</span></td><td>${scipTag(s)}</td><td>${esc(s.scip.reason||'—')}</td><td class="mono">${esc(s.scip.mode)}</td><td class="hash">${esc(s.scip.missing.join(', ')||'—')}</td></tr>`).join('')}</tbody></table>`:`<div class="empty"><strong>Sem determinações</strong></div>`}</section><div class="note warn">O limiar de 0,1% é avaliado no artigo/componente pertinente. REQUIRED depende conjuntamente da lista vigente, concentração, mercado, operador e dados mínimos do dossiê.</div>`}
function tabDossier(b){const m=manifestOf(b);if(!m)return`<div class="empty"><strong>Nenhum manifesto atual</strong>Ele é gerado somente com cobertura terminal completa e ao menos uma determinação REQUIRED.</div>`;return`<section class="panel"><header><h2>Manifesto da versão de produto #${b.article_definition_version_id}</h2><span class="spacer"></span><span class="tag ok">MANIFEST_READY</span></header><div class="pad"><dl class="kv">${hashRow('manifestHash',m.manifest_hash)}${hashRow('inputSignature',m.input_signature)}${hashRow('formatPackageHash',m.format_package_hash)}<dt>Escopo</dt><dd>article_definition_version_id ${m.article_definition_version_id}</dd><dt>Entradas</dt><dd>${m.payload.entries.length}</dd></dl><p class="hint">O número de série da bateria não integra o manifesto. Unidades equivalentes reutilizam este artefato somente quando versão e inputSignature coincidem.</p></div></section><div class="grid g2"><section class="panel"><header><h2>Simulação local</h2></header><div class="pad"><div class="note warn">Esta ação não gera <span class="mono">.i6z</span>, não executa XSD e não calcula um scipDossierHash real.</div>${b.package_simulation?`<dl class="kv">${hashRow('simulationHash',b.package_simulation.hash)}<dt>Estado</dt><dd>PACKAGE_SIMULATION_ONLY</dd></dl>`:`<button class="btn quiet" onclick="__simulatePackage(${b.id})">Simular empacotamento</button>`}</div></section><section class="panel"><header><h2>Pacote validado pelo backend</h2></header><div class="pad">${b.validated_dossier?`<span class="tag ok">I6Z_VALIDATED</span><dl class="kv" style="margin-top:12px">${hashRow('scipDossierHash',b.validated_dossier.hash)}<dt>Validação</dt><dd>${esc(b.validated_dossier.validator)}</dd></dl>`:`<div class="field"><label>scipDossierHash real (0x + 64 hex)</label><input id="real-dossier" class="mono" placeholder="Cole a saída do gerador IUCLID validado"></div><button class="btn" onclick="__registerDossier(${b.id})">Registrar validação real</button>`}</div></section></div>${b.validated_dossier?`<section class="panel"><header><h2>Resposta S2S</h2>${b.submission?`<span class="spacer"></span><span class="tag ${b.submission.status==='ACCEPTED'?'ok':'bad'}">${b.submission.status}</span>`:''}</header><div class="pad"><div class="note">Registre apenas uma resposta realmente devolvida pelo gateway ECHA S2S. A tela não transmite credenciais.</div><div class="grid g2"><div class="field"><label>submissionId</label><input id="sub-id" class="mono" value="${esc(b.submission?.id||'')}"></div><div class="field"><label>Estado terminal</label><select id="sub-status"><option>ACCEPTED</option><option>REJECTED</option></select></div></div><button class="btn" onclick="__saveSubmission(${b.id})">Registrar resposta real</button></div></section>`:''}`}
window.__simulatePackage=id=>{const b=S.batteries.find(x=>x.id===id),m=manifestOf(b);b.package_simulation={hash:hashOf({manifest:m.manifest_hash,format:m.format_package_hash,mode:'SIMULATION'}),at:now()};log('a','Simulação de pacote criada · sem .i6z e sem validação ECHA');save();render()};window.__registerDossier=id=>{const b=S.batteries.find(x=>x.id===id),v=document.getElementById('real-dossier').value.trim();if(!/^0x[0-9a-fA-F]{64}$/.test(v))return toast('Informe um hash real no formato 0x + 64 hex.');b.validated_dossier={hash:v,validator:'BACKEND_IUCLID_XSD_BUSINESS_RULES',at:now()};log('g','Pacote IUCLID validado externamente registrado');save();render()};window.__saveSubmission=id=>{const b=S.batteries.find(x=>x.id===id),sid=document.getElementById('sub-id').value.trim(),status=document.getElementById('sub-status').value;if(!sid)return toast('Informe o submissionId real.');b.submission={id:sid,status,dossier_hash:b.validated_dossier.hash,response_hash:hashOf({sid,status,dossier:b.validated_dossier.hash}),at:now()};log(status==='ACCEPTED'?'g':'r','Resposta ECHA S2S registrada · '+sid+' · '+status);save();render()};
function tabExplanation(b){const gates=gate(b);return`<section class="panel"><header><h2>Gate de elegibilidade</h2></header><div class="pad">${gates.map(x=>`<div class="action"><span class="tag ${x.ok?'ok':'pending'}">${x.ok?'ATENDIDA':'PENDENTE'}</span><div>${esc(x.k)}</div></div>`).join('')}</div></section>${b.explanation?`<section class="panel"><header><h2>Explicação</h2><span class="spacer"></span><span class="tag ai">${b.explanation.deterministic_result}</span></header><div class="pad"><div class="note ai">A classificação foi calculada antes da narrativa. A IA não decide obrigação, estado ou risco.</div><p>${esc(b.explanation.narrative.coverage)}</p><ul>${b.explanation.narrative.findings.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><strong>Limites.</strong> ${esc(b.explanation.narrative.limits)}</p><dl class="kv">${hashRow('inputSignature',b.explanation.input_signature)}<dt>promptVersion</dt><dd>${esc(b.explanation.prompt_version)}</dd><dt>Modelo</dt><dd>${esc(b.explanation.model)}</dd></dl></div></section>`:`<div class="empty"><strong>Sem explicação atual</strong>Itens terminais com NEEDS_DATA também liberam uma explicação INCONCLUSIVO; não ficam presos fora do gate.</div>`}`}
function tabAudit(b){const m=manifestOf(b);return`<section class="panel"><header><h2>Provas por etapa</h2></header><div class="pad"><dl class="kv">${hashRow('passportDataHash',b.passport_data_hash)}${hashRow('evidencePlanHash',b.plan_hash)}${hashRow('echaDatasetHash',S.snapshot.hash)}${hashRow('ruleSetHash',RULE_SET_HASH)}${hashRow('manifestHash',m?.manifest_hash)}${hashRow('scipDossierHash',b.validated_dossier?.hash)}${hashRow('scipResponseHash',b.submission?.response_hash)}${hashRow('explanationInputSignature',b.explanation?.input_signature)}</dl></div></section><section class="panel"><header><h2>Rede e transações</h2><span class="spacer"></span><span class="eyebrow">Ethereum Sepolia · 11155111</span></header><div class="pad"><dl class="kv"><dt>Contrato</dt><dd>${CONTRACT}</dd><dt>Forwarder CRE</dt><dd>${FORWARDER}</dd></dl><div class="note warn" style="margin-top:14px">Rede de teste e contrato aparecem na Auditoria, não no cabeçalho operacional. Hashes de conteúdo provam versões; não tornam o Supabase imutável por si só.</div></div></section>`}
function processing(){const rows=S.batteries.flatMap(b=>activeSlots(b).map(s=>({b,s})));return head('Processamento','Filas derivadas do estado. Os botões abaixo executam uma simulação local; produção deve chamar os workflows CRE no backend.')+`<div class="row" style="margin-bottom:16px"><button class="btn" onclick="__cycleAll()">Simular todas as baterias</button><button class="btn ghost" onclick="__loadSnapshot()">Reler snapshot ACTIVE</button></div><section class="panel">${rows.length?`<table><thead><tr><th>Bateria</th><th>Slot</th><th>Identidade</th><th>ECHA</th><th>SCIP</th><th>Tentativas</th></tr></thead><tbody>${rows.map(({b,s})=>`<tr class="click" onclick="__go('bateria/${b.id}')"><td>${esc(b.serial)}</td><td class="hash">${short(s.evidence_slot_id)}</td><td>${s.identity.status}</td><td>${s.echa.status} · ${s.echa.regulatory_status||'—'}</td><td>${s.scip.status}</td><td class="mono">${s.identity.attempts}/${s.echa.attempts}/${s.scip.attempts}</td></tr>`).join('')}</tbody></table>`:`<div class="empty"><strong>Nenhum item</strong></div>`}</section><section class="panel"><header><h2>Log local</h2></header><div class="pad">${logView()}</div></section>`}
window.__cycleAll=async()=>{for(const b of S.batteries)if(b.plan_closed)await cycle(b)};
function logView(limit){const l=limit?S.log.slice(0,limit):S.log;return`<div class="log">${l.length?l.map(x=>`<div><span class="${x.kind}">${new Date(x.at).toLocaleTimeString('pt-BR')}</span> ${esc(x.msg)}</div>`).join(''):'<div>Sem atividade.</div>'}</div>`}
function audit(){return head('Auditoria','Provas criptográficas, ambiente de rede e limitações da implementação.')+`<div class="grid g2"><section class="panel"><header><h2>Ambiente blockchain</h2></header><div class="pad"><dl class="kv"><dt>Rede</dt><dd>Ethereum Sepolia</dd><dt>chainId</dt><dd>11155111</dd><dt>Contrato</dt><dd>${CONTRACT}</dd><dt>Forwarder CRE</dt><dd>${FORWARDER}</dd></dl></div></section><section class="panel"><header><h2>Limites explícitos</h2></header><div class="pad"><div class="note warn">Este arquivo é um protótipo funcional local. Ele não assina transações, não usa credenciais S2S e não substitui o backend/CRE.</div><button class="btn quiet" onclick="__go('contrato')">Ver pendências técnicas do contrato</button></div></section></div><section class="panel"><header><h2>Artefatos imutáveis no protótipo</h2></header><div class="pad"><dl class="kv"><dt>Versões de produto</dt><dd>${S.products.length}</dd><dt>Manifestos históricos</dt><dd>${S.manifests.length}</dd><dt>Snapshots ativos</dt><dd>${S.snapshot.loaded?1:0}</dd></dl></div></section>`}
function contractView(){return head('Pendências técnicas do contrato','Visão para desenvolvimento; removida da navegação principal para não competir com a operação.')+`<div class="note bad"><strong>Bloqueio conhecido:</strong> a implementação de referência exige explanationHash no relatório individual, embora a explicação só exista após a cobertura completa. O contrato precisa aceitar hash zero nessa fase ou separar o relatório agregado.</div>${[['Vínculo da declaração','Comparar declarationHash do relatório com o compromisso original.'],['Plano on-chain','Registrar evidencePlanHash e expectedEvidenceCount antes de concluir DOCUMENTS_VERIFIED.'],['Revisões','Permitir nova revisão após atualização de datasetHash, preservando o histórico.'],['Estados','Representar ERROR, CANCELLED e finalidade/finalidade da transação.']].map(([t,d])=>`<section class="panel"><header><h2>${t}</h2><span class="spacer"></span><span class="tag bad">PENDENTE</span></header><div class="pad">${d}</div></section>`).join('')}`}
function settings(){return head('Configurações','Conexão do navegador com a API protegida que intermedeia o acesso ao Supabase.')+`<div class="note"><strong>Arquitetura ativa.</strong> O navegador usa somente a chave publishable e chama a Edge Function <span class="mono">super-worker</span>. A função consulta o banco com a credencial secreta mantida pelo Supabase. Nunca coloque uma chave <span class="mono">sb_secret_</span> nesta tela.</div><section class="panel"><header><h2>Supabase · Edge Function</h2></header><div class="pad"><div class="field"><label>URL base do projeto</label><input id="c-url" class="mono" value="${esc(S.conn.url)}" placeholder="https://mnmflnqmohgsxgavwenn.supabase.co"><p class="hint">Informe apenas a URL base. Caminhos como /rest/v1 e /functions/v1 são removidos automaticamente.</p></div><div class="field"><label>Chave publishable</label><input id="c-key" type="password" class="mono" value="${esc(S.conn.key)}"><p class="hint">A chave pública começa com sb_publishable_. A chave secreta nunca sai do backend.</p></div><button class="btn" onclick="__testConnection()">Testar Edge Function</button><div id="c-result" style="margin-top:14px"></div></div></section><section class="panel"><header><h2>Migrações esperadas</h2></header><div class="pad"><div class="log"><div>1 · supabase_battery_core.sql</div><div>2 · supabase_echa_candidate_list.sql</div><div>3 · supabase_scip_determination.sql</div><div>4 · supabase_battery_ai_explanations.sql</div></div></div></section>`}
window.__testConnection=async()=>{const raw=document.getElementById('c-url').value.trim(),url=raw.replace(/\/(?:rest|functions)\/v1(?:\/.*)?$/,'').replace(/\/$/,''),key=document.getElementById('c-key').value.trim(),out=document.getElementById('c-result');if(!url||!key)return toast('Informe a URL base e a chave publishable.');if(!/^https:\/\/[^/]+\.supabase\.co$/.test(url))return toast('A URL deve ser a URL base do projeto Supabase.');if(!key.startsWith('sb_publishable_'))return toast('Use somente a chave que começa com sb_publishable_.');document.getElementById('c-url').value=url;S.conn={url,key,ok:false};out.innerHTML='<div class="note">Chamando a Edge Function super-worker…</div>';try{const r=await fetch(url+'/functions/v1/super-worker',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({action:'health'})}),txt=await r.text();let payload=null;try{payload=JSON.parse(txt)}catch(_){}const connected=r.ok&&payload?.ok===true;S.conn.ok=connected;out.innerHTML=`<div class="note ${connected?'':'warn'}"><strong>HTTP ${r.status}.</strong> ${connected?'Edge Function conectada ao banco com segurança.':'A Edge Function respondeu, mas não confirmou a conexão com o banco.'}</div><div class="log">${esc(txt.slice(0,700))}</div>`;document.getElementById('mode').textContent=connected?'edge function conectada':'protótipo local · função com erro';document.getElementById('mode').classList.toggle('live',connected);save()}catch(e){S.conn.ok=false;out.innerHTML=`<div class="note bad"><strong>Falha de rede ou CORS.</strong> ${esc(e.message)}</div>`;document.getElementById('mode').textContent='protótipo local · função inacessível';document.getElementById('mode').classList.remove('live');save()}};
window.__loadSnapshot=async()=>{if(!S.conn.url||!S.conn.key){toast('Configure o Supabase primeiro.');go('configuracoes');return}const h={apikey:S.conn.key,Authorization:'Bearer '+S.conn.key};try{const r=await fetch(S.conn.url+'/rest/v1/echa_candidate_list_snapshots?status=eq.ACTIVE&select=id,package_version,dataset_hash,published_at&limit=1',{headers:h});if(!r.ok)throw new Error('HTTP '+r.status+' ao ler snapshot');const [sn]=await r.json();if(!sn)throw new Error('Nenhum snapshot ACTIVE');const e=await fetch(S.conn.url+'/rest/v1/echa_candidate_list_entries?snapshot_id=eq.'+sn.id+'&select=echa_id,substance_name,ec_number,cas_number,inclusion_date,reason_for_inclusion&limit=5000',{headers:h});if(!e.ok)throw new Error('HTTP '+e.status+' ao ler entradas');const rows=await e.json();activateSnapshot(rows.map(x=>({echa_id:x.echa_id||'',name:x.substance_name||'',ec:x.ec_number||'',cas:x.cas_number||'',inclusion:x.inclusion_date||'',reason:x.reason_for_inclusion||''})),sn.package_version,'SUPABASE_ACTIVE',{id:sn.id,hash:sn.dataset_hash,published:sn.published_at})}catch(e){toast(e.message);log('r','Snapshot não carregado · '+e.message)}};
window.__demoSnapshot=()=>activateSnapshot([{echa_id:'100.028.273',name:'Lead',ec:'231-100-4',cas:'7439-92-1',inclusion:'2018-06-27',reason:'Tóxico para reprodução'},{echa_id:'100.028.292',name:'Cadmium',ec:'231-152-8',cas:'7440-43-9',inclusion:'2013-06-20',reason:'Carcinogênico'}],'AMOSTRA_DEMONSTRATIVA_2026-08','LOCAL_DEMO');
function report(id){const b=S.batteries.find(x=>x.id===Number(id));if(!b)return'<div class="empty">Bateria não encontrada.</div>';const p=productOf(b),c=coverage(b),m=manifestOf(b),rh=hashOf({battery:b.battery_id,plan:b.plan_hash,dataset:S.snapshot.hash,rule:RULE_SET_HASH,slots:activeSlots(b).map(s=>({slot:s.evidence_slot_id,decl:s.declaration_hash,echa:s.echa.hash,scip:s.scip.hash})),manifest:m?.manifest_hash,dossier:b.validated_dossier?.hash,response:b.submission?.response_hash});return`<div class="printbar"><button class="btn" onclick="print()">Imprimir / salvar PDF</button><button class="btn quiet" onclick="__go('bateria/${b.id}')">Voltar</button><span class="hint">Relatório de verificação da unidade; o dossiê SCIP, quando aplicável, pertence à versão do produto.</span></div><article class="sheet"><div class="eyebrow">Rastro Batt · relatório de verificação</div><h1>${esc(b.serial)}</h1><p>${esc(p?.article||b.model)} · versão de produto #${b.article_definition_version_id}</p><section><h3>1 · Identidade da unidade</h3><dl class="kv">${hashRow('batteryId',b.battery_id)}${hashRow('passportDataHash',b.passport_data_hash)}<dt>Estado determinístico</dt><dd>${b.state}</dd><dt>Cobertura</dt><dd>${c.processed}/${b.expected||'—'}</dd></dl></section><section><h3>2 · Evidências</h3><table><thead><tr><th>evidence_slot_id</th><th>Artigo</th><th>Substância</th><th>ECHA</th><th>SCIP</th></tr></thead><tbody>${activeSlots(b).map(s=>`<tr><td class="hash">${short(s.evidence_slot_id)} · tentativa ${s.attempt}</td><td>${esc(s.article_name||s.article_id)}</td><td>${esc(s.cas||s.ec||s.echa_id)}</td><td>${esc(s.echa.regulatory_status||'PENDING')}</td><td>${esc(s.scip.determination||'PENDING')}</td></tr>`).join('')}</tbody></table></section><section><h3>3 · Escopo SCIP</h3><p>${m?`Manifesto ${short(m.manifest_hash)} escopado por article_definition_version_id ${m.article_definition_version_id}.`:'Nenhum manifesto SCIP atual.'}</p><p>${b.package_simulation&&!b.validated_dossier?'<strong>Existe apenas simulação local; nenhum .i6z foi gerado ou validado.</strong>':b.validated_dossier?`Pacote externo validado: ${short(b.validated_dossier.hash)}.`:'Sem pacote IUCLID.'}</p></section><section><h3>4 · Índice de provas</h3><dl class="kv">${hashRow('evidencePlanHash',b.plan_hash)}${hashRow('datasetHash',S.snapshot.hash)}${hashRow('ruleSetHash',RULE_SET_HASH)}${hashRow('manifestHash',m?.manifest_hash)}${hashRow('scipDossierHash',b.validated_dossier?.hash)}${hashRow('scipResponseHash',b.submission?.response_hash)}${hashRow('reportHash',rh)}</dl></section><section><h3>5 · Limites</h3><p>Documento de verificação documental. Não certifica composição, segurança ou conformidade integral. NOT_FOUND_IN_SNAPSHOT significa apenas ausência de correspondência na versão consultada.</p></section></article>`}
function render(){const mode=document.getElementById('mode');mode.textContent=S.conn.ok?'edge function conectada':'protótipo local · sem backend';mode.classList.toggle('live',!!S.conn.ok);document.getElementById('nav').innerHTML=nav();const [r,id]=route(),views={painel:dashboard,produtos:products,baterias:batteries,fornecedores:suppliers,evidencias:evidenceView,dossies:dossiers,nova:formNew,processamento:processing,auditoria:audit,configuracoes:settings,contrato:contractView};document.getElementById('view').innerHTML=r==='bateria'?batteryDetail(id):r==='relatorio'?report(id):(views[r]||dashboard)();if(r==='nova')window.__previewNew()}render();
</script>
</body>
</html>

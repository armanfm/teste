<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste de Endpoint</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;margin:0;padding:40px 20px;color:#111}
    .box{max-width:760px;margin:0 auto;background:#fff;border:1px solid #ddd;border-radius:14px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    h1{margin:0 0 8px;font-size:24px}
    p{margin:0 0 20px;color:#555}
    label{display:block;font-weight:700;margin-bottom:8px}
    input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #bbb;border-radius:9px;font-size:15px;margin-bottom:12px}
    button{border:0;border-radius:9px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;background:#111;color:#fff}
    #status{margin-top:18px;font-weight:700}
    pre{margin-top:14px;background:#111;color:#eee;padding:16px;border-radius:10px;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word}
  </style>
</head>
<body>
  <div class="box">
    <h1>Teste de Endpoint</h1>
    <p>Informe uma URL e veja se o navegador consegue buscar o conteúdo.</p>

    <label for="endpoint">Endereço</label>
    <input id="endpoint" type="url" autocomplete="off">

    <button id="buscar">Buscar</button>

    <div id="status">Aguardando endereço.</div>
    <pre id="saida">Nenhum dado carregado.</pre>
  </div>

  <script>
    const endpoint = document.getElementById("endpoint");
    const buscar = document.getElementById("buscar");
    const status = document.getElementById("status");
    const saida = document.getElementById("saida");

    buscar.addEventListener("click", async () => {
      const url = endpoint.value.trim();

      if (!url) {
        status.textContent = "Informe um endereço.";
        saida.textContent = "Nenhum dado carregado.";
        return;
      }

      status.textContent = "Buscando...";
      saida.textContent = "";

      try {
        const response = await fetch(url, {
          method: "GET",
          headers: {
            "Accept": "application/json, application/geo+json, text/plain, */*"
          }
        });

        const contentType = response.headers.get("content-type") || "";
        const text = await response.text();

        status.textContent = `HTTP ${response.status} ${response.statusText}`;

        if (contentType.includes("json") || contentType.includes("geo+json")) {
          try {
            saida.textContent = JSON.stringify(JSON.parse(text), null, 2);
          } catch {
            saida.textContent = text;
          }
        } else {
          saida.textContent = text;
        }
      } catch (error) {
        status.textContent = "Falha na requisição.";
        saida.textContent =
          error.message +
          "\n\nSe a URL abrir no navegador mas falhar aqui, pode ser bloqueio de CORS no servidor.";
      }
    });
  </script>
</body>
</html>
